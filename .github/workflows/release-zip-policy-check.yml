name: Release ZIP policy guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-zip-policy:
    name: Enforce release ZIP and no-artifact-storage policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release ZIP publication policy
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          workflow_dir = Path(".github/workflows")
          build_output = re.compile(
              r"assemble(?:Debug|Release)|bundleRelease|export-(?:debug|release)|"
              r"build/libs/\*\.jar|outputs/apk|outputs/bundle|APK_PATH|"
              r"PaperSkies-debug\.apk|ibex_universal_cx_trainer_ios\.ipa",
              re.IGNORECASE,
          )
          issues = []
          for path in sorted(list(workflow_dir.glob("*.yml")) + list(workflow_dir.glob("*.yaml"))):
              if path.name == "release-zip-policy-check.yml":
                  continue
              text = path.read_text(encoding="utf-8")
              if re.search(r"uses:\s*actions/upload-artifact@v\d+", text):
                  issues.append(f"{path}: Actions artifact uploads are prohibited; use a release ZIP instead")
              has_publish_trigger = bool(re.search(r"(?m)^  (?:push|workflow_dispatch):", text))
              if build_output.search(text) and has_publish_trigger and "./.github/actions/publish-release-zip" not in text:
                  issues.append(f"{path}: build output pattern found, but no local release ZIP publisher is used")
          if issues:
              print("Release ZIP policy violations:")
              for issue in issues:
                  print(f"- {issue}")
              sys.exit(1)
          print("Release ZIP policy PASS: build outputs use GitHub Release ZIPs; no Actions artifact uploads remain.")
          PY
